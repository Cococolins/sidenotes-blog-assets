<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sidenotes Dashboard Editor fixture</title>
    <link rel="stylesheet" href="/dist/dashboard/sidenotes-editor.css">
    <style>
      body {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 16px 80px;
        color: #243029;
        background: #f7f8f6;
        font: 16px/1.5 system-ui, sans-serif;
      }

      .post-form {
        padding: 18px;
        background: #fff;
        border: 1px solid #d9dfdb;
        border-radius: 12px;
      }

      #header_content {
        margin-bottom: 18px;
        padding: 10px;
        border: 1px solid #d9dfdb;
      }

      #body_content {
        width: 100%;
        min-height: 420px;
      }

      #sn-md-toolbar {
        display: flex;
      }

      .sticky-controls {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
    </style>
    <script>
      const fixtureUrl = new URL(location.href);
      fixtureUrl.pathname = "/colin/dashboard/posts/new/";
      if (!fixtureUrl.searchParams.has("sn-editor")) {
        fixtureUrl.searchParams.set("sn-editor", "1");
      }
      history.replaceState(null, "", fixtureUrl);
    </script>
  </head>
  <body>
    <h1>Dashboard editor fixture</h1>
    <p>
      用本地 HTTP server 打开本文件。地址栏加
      <code>?sn-editor=0</code> 可验证原生回退。
    </p>
    <form class="post-form">
      <div id="header_content" contenteditable="true">title: Fixture</div>
      <input id="hidden_header_content" type="hidden" name="header_content">
      <div id="sn-md-toolbar" role="toolbar" aria-label="旧 Markdown toolbar">
        <button type="button">Bold</button>
      </div>
      <textarea id="body_content" name="body_content"># 一份测试文章

这是用于验证 **Visual** 与 Markdown 同步的正文。

## 清单

- 中文输入
- [普通链接](https://sidenotes.cc)
- `inline code`

```js
console.log("code block");
```
</textarea>
      <div class="sticky-controls">
        <button type="submit">Save as draft</button>
        <button type="button" id="preview">Preview</button>
        <button type="button" class="markdown_line_fixer">Fix new lines</button>
      </div>
    </form>
    <script type="module" src="/dist/dashboard/sidenotes-editor.js"></script>
  </body>
</html>
